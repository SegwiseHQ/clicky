[project]
name = "clicky"
version = "0.3.0"
description = "A free, lightweight ClickHouse desktop client"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "clickhouse-connect>=1.6.0",
    "cryptography>=49.0.0",
    "dearpygui>=2.3.1",
    "sqlparse>=0.5.5",
    "pyinstaller>=6.21.0",
]

[project.urls]
Homepage = "https://github.com/SegwiseHQ/clicky"
Repository = "https://github.com/SegwiseHQ/clicky"
Issues = "https://github.com/SegwiseHQ/clicky/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "pre-commit>=4.6.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".ruff_cache",
    "dist",
    "build",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM108",  # ternary operator
    "SIM105",  # contextlib.suppress — too noisy for DearPyGUI try/except patterns
    "SIM117",  # combine with statements — DearPyGUI context managers need nesting
    "F403",    # star imports (DearPyGUI pattern)
    "F405",    # may be undefined from star imports
    "E501",    # line too long — ruff format handles code; comments/docstrings are fine
]

[tool.ruff.lint.isort]
known-first-party = ["components"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
